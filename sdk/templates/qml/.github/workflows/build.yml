name: Package QML extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cmake -S . -B build
      - run: cmake --build build
      - name: Write checksums
        run: |
          cd build/packages
          for package in *.zip; do sha256sum "$package" > "$package.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qml-extension
          path: build/packages/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(jq -r .version extension.json)"
          gh release create "$TAG" build/packages/* --verify-tag --generate-notes --draft
    permissions:
      contents: write

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform == 'windows' && 'windows' || 'offscreen' }}
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Fusion
      # The Windows runner's 1024px display must accommodate 1360px logical UI tests.
      QT_SCALE_FACTOR: ${{ matrix.platform == 'windows' && '0.5' || '1' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: extensions/package.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config libavformat-dev libavutil-dev libavcodec-dev libswresample-dev libavfilter-dev zlib1g-dev \
            libsecret-1-dev libpulse-dev libssl-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 gnome-keyring dbus-x11 libglib2.0-bin fonts-noto-cjk libpipewire-0.3-0 \
            extra-cmake-modules libxkbcommon-dev libxcb1-dev libx11-dev libwayland-dev wayland-protocols \
            meson libffi-dev libexpat1-dev
      - name: Install Linux Qt
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          # Pitch-preserving playback speed requires Qt Multimedia 6.10+.
          version: '6.11.2'
          modules: 'qtmultimedia qtshadertools'
          cache: true
      - name: Build Linux Wayland 1.24.0 for the release Qt
        if: runner.os == 'Linux'
        run: |
          # Qt 6.11's private headers use wl_fixes, absent from Ubuntu 24.04's Wayland 1.22.
          curl --fail --location --retry 3 \
            https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.24.0/downloads/wayland-1.24.0.tar.xz \
            --output "$RUNNER_TEMP/wayland-1.24.0.tar.xz"
          echo "82892487a01ad67b334eca83b54317a7c86a03a89cfadacfef5211f11a5d0536  $RUNNER_TEMP/wayland-1.24.0.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/wayland-1.24.0.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/wayland-build" "$RUNNER_TEMP/wayland-1.24.0" \
            --prefix="$RUNNER_TEMP/wayland" --libdir=lib --buildtype=release \
            -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          meson compile -C "$RUNNER_TEMP/wayland-build" -j 2
          meson install -C "$RUNNER_TEMP/wayland-build"
          echo "$RUNNER_TEMP/wayland/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/wayland/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/wayland/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build LayerShellQt with the release Qt
        if: runner.os == 'Linux'
        run: |
          pkg-config --atleast-version=1.24.0 wayland-client
          git clone https://github.com/KDE/extra-cmake-modules.git .ci-ecm
          git -C .ci-ecm checkout a1dac86d6c848473d840b748b82694ef6916a3ca # 6.26.0
          cmake -S .ci-ecm -B .ci-ecm/build -G Ninja -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ecm"
          cmake --install .ci-ecm/build
          git clone https://github.com/KDE/layer-shell-qt.git .ci-layer-shell-qt
          git -C .ci-layer-shell-qt checkout 1613a5f61150192d8187989466d4ff961f4ce2c4 # 6.7.4
          cmake -S .ci-layer-shell-qt -B .ci-layer-shell-qt/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/ecm;$RUNNER_TEMP/wayland" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/layershell" \
            -DKDE_INSTALL_LIBDIR=lib -DKDE_INSTALL_QTPLUGINDIR=plugins -DCMAKE_SKIP_RPATH=ON
          cmake --build .ci-layer-shell-qt/build --parallel 2
          cmake --install .ci-layer-shell-qt/build
      - name: Build Linux Fcitx5-Qt 5.1.9 with the release Qt
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/fcitx/fcitx5-qt.git .ci-fcitx5-qt
          git -C .ci-fcitx5-qt checkout 3ade1a680221f3e211adcfb50c323285c4bded77
          # Backport upstream's explicit private-module lookup for Qt 6.10+.
          # https://github.com/fcitx/fcitx5-qt/commit/6ac4fdd8e90ff9c25a5219e15e83740fa38c9c71
          git -C .ci-fcitx5-qt apply "$PWD/scripts/ci/fcitx5-qt6-private-modules.patch"
          # Qt's standard Wayland text input remains available without the optional workaround.
          cmake -S .ci-fcitx5-qt -B .ci-fcitx5-qt/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DENABLE_QT4=OFF -DENABLE_QT5=OFF -DENABLE_QT6=ON \
            -DBUILD_ONLY_PLUGIN=ON -DENABLE_QT6_WAYLAND_WORKAROUND=OFF \
            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_INSTALL_QT6PLUGINDIR="$RUNNER_TEMP/fcitx5-qt/plugins"
          cmake --build .ci-fcitx5-qt/build --parallel 2
          cmake --install .ci-fcitx5-qt/build
      - name: Build Linux QtKeychain 0.17.0
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/frankosterfeld/qtkeychain.git .ci-qtkeychain
          git -C .ci-qtkeychain checkout 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
          cmake -S .ci-qtkeychain -B .ci-qtkeychain/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON -DBUILD_TEST_APPLICATION=OFF \
            -DBUILD_TRANSLATIONS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qtkeychain"
          cmake --build .ci-qtkeychain/build --parallel 2
          cmake --install .ci-qtkeychain/build
      - name: Enable native symlinks on the disposable Windows test runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Install Windows dependencies (UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-zlib

      - name: Restore compiled object cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.platform }}-

      # ── Build ──────────────────────────────────────────────────────
      - name: Configure and build Linux
        id: build_linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qtkeychain;$RUNNER_TEMP/layershell;$RUNNER_TEMP/wayland" \
            -DNEKOTUNE_ENABLE_WALLPAPER=ON
          cmake --build build --parallel 2
          test "$(jq -r .backend build/wallpaper-runtime.json)" = wayland
      - name: Configure and build Windows
        id: build_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DNEKOTUNE_ENABLE_WALLPAPER=ON
          cmake --build build --parallel 2

      # Packaging also runs after test failures, so resolve its version first.
      - name: Extract version from CMakeLists.txt
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^    VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ── Test ───────────────────────────────────────────────────────
      - name: Run Linux CTest and check extension types
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test_result=0
          ctest --test-dir build --output-on-failure --timeout 180 || test_result=$?
          if [[ "$test_result" != 0 ]]; then cat build/tests/nekotune_*.txt; fi
          pnpm --dir extensions check
          uv run --no-project --python 3.12 -m unittest discover -s scripts/ci/tests
          exit "$test_result"
      - name: Run Windows CTest and check extension types
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test_result=0
          ctest --test-dir build --output-on-failure --timeout 180 || test_result=$?
          if [[ "$test_result" == 0 ]]; then
            ctest --test-dir build --output-on-failure --timeout 180 \
              --repeat until-fail:3 -R '^nekotune_(ai|extension_sdk|system_tray)_test$' || test_result=$?
          fi
          if [[ "$test_result" != 0 ]]; then cat build/tests/nekotune_*.txt; fi
          pnpm --dir extensions check
          exit "$test_result"

      - name: Save compiled objects even when tests expose a regression
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}

      # ── Package ────────────────────────────────────────────────────
      - name: Bundle and smoke test Linux distribution
        id: package_linux
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_linux.outcome == 'success' && steps.version.outcome == 'success' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake --install build --prefix "$PWD/stage"
          install -Dm644 "$RUNNER_TEMP/wayland-1.24.0/COPYING" stage/licenses/Wayland/COPYING
          uv run --no-project --python 3.12 scripts/ci/package_release.py \
            --stage stage --qt-prefix "$QT_ROOT_DIR" --library-dir "$RUNNER_TEMP/qtkeychain/lib" \
            --plugin-dir "$RUNNER_TEMP/fcitx5-qt/plugins" --fcitx-source .ci-fcitx5-qt \
            --library-dir "$RUNNER_TEMP/layershell/lib" --plugin-dir "$RUNNER_TEMP/layershell/plugins" \
            --library-dir "$RUNNER_TEMP/wayland/lib" \
            --layershell-source .ci-layer-shell-qt \
            --platform linux --version "$VERSION"
          node scripts/ci/smoke_release.mjs stage
      - name: Bundle and smoke test Windows distribution
        id: package_windows
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_windows.outcome == 'success' && steps.version.outcome == 'success' }}
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cmake --install build --prefix "$(cygpath -m "$PWD/stage")"
          uv run --no-project --python 3.12 scripts/ci/package_release.py \
            --stage stage --qt-prefix "$(cygpath -m /ucrt64)" --platform windows --version "$VERSION"
          node scripts/ci/smoke_release.mjs stage
      - name: Upload executable distribution
        if: ${{ !cancelled() && (steps.package_linux.outcome == 'success' || steps.package_windows.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoTune-${{ matrix.platform }}-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
